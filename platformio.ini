; ============================================================
; PlatformIO — Sistem Monitoring Parameter Fisiologis ESP32
; PRD v0.3: 4 unit fisik = 4 ESP32 = 4 environment build
;
;   env:node_hr      Node Inti 1 — MAX30102 (HR + SpO2)   [WAJIB]
;   env:node_suhu    Node Inti 2 — DS18B20 (Suhu)         [WAJIB]
;   env:node_ecg     Node Lanjutan — AD8232 (ECG)         [OPSIONAL]
;   env:controller   Controller — OLED + MAX98357A I2S
;
; Komunikasi: ESP-NOW kanal 1, 2.4 GHz, tanpa router
; Audio: 13 file MP3 di folder data/ -> SPIFFS (hanya controller)
;
; Cara pakai:
;   pio run -e node_hr -t upload       # flash board HR
;   pio run -e node_suhu -t upload     # flash board Suhu
;   pio run -e node_ecg -t upload      # flash board ECG
;   pio run -e controller -t upload    # flash controller
;   pio run -e controller -t uploadfs  # upload 13 MP3 ke SPIFFS
;   pio run                            # default: node_hr saja
;
; Kalau 4 board dicolok bersamaan, buka komentar upload_port pada
; tiap environment dan isi COM port masing-masing (cek di Device Manager).
; ============================================================

[platformio]
default_envs = node_hr
data_dir = data

[env]
; ---------- Berlaku untuk semua 4 board ----------
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
build_flags =
    -DESPNOW_CHANNEL=1
    -DCORE_DEBUG_LEVEL=0

; ============================================================
; 1. NODE INTI — HR & SpO2 (MAX30102)  [Tier 1, wajib]
; ============================================================
[env:node_hr]
build_src_filter = +<*> -<*.cpp> +<node_hr.cpp>
build_flags =
    ${env.build_flags}
    -DROLE_NODE_HR=1
    -DNODE_TIER=1
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
; upload_port = COM3
; monitor_port = COM3

; ============================================================
; 2. NODE INTI — SUHU (DS18B20)  [Tier 1, wajib]
;    Stabilisasi: 3 baca stabil (delta < 0.2 C), baca tiap 2 detik
; ============================================================
[env:node_suhu]
build_src_filter = +<*> -<*.cpp> +<node_suhu.cpp>
build_flags =
    ${env.build_flags}
    -DROLE_NODE_SUHU=1
    -DNODE_TIER=1
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
; upload_port = COM4
; monitor_port = COM4

; ============================================================
; 3. NODE LANJUTAN — ECG (AD8232)  [Tier 2, OPSIONAL]
;    Sampling 250 Hz, hitung puncak dalam window 10 detik
;    Tidak aktif = STANDBY (bukan TERPUTUS)
; ============================================================
[env:node_ecg]
build_src_filter = +<*> -<*.cpp> +<node_ecg.cpp>
build_flags =
    ${env.build_flags}
    -DROLE_NODE_ECG=1
    -DNODE_TIER=2
; Tidak butuh library eksternal — cukup ADC + digitalRead bawaan Arduino
; upload_port = COM5
; monitor_port = COM5

; ============================================================
; 4. CONTROLLER — ESP-NOW receiver + OLED SH1106 + MAX98357A I2S
;    Satu-satunya board yang butuh SPIFFS (13 MP3 di folder data/)
; ============================================================
[env:controller]
build_src_filter = +<*> -<*.cpp> +<controller.cpp>
build_flags =
    ${env.build_flags}
    -DROLE_CONTROLLER=1
    -DSPIFFS_TRACK_COUNT=13
lib_deps =
    olikraus/U8g2@^2.36.5
    earlephilhower/ESP8266Audio@^1.9.5
; upload_port = COM6
; monitor_port = COM6
